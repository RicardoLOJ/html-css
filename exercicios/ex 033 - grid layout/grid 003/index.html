<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container {
            display: grid;

            /*Primeiro as linhas e depois as colunas*/
            grid-template: 100px 100px 100px / auto auto auto;

            /*Primeiro align-items e depois justify-items*/
            place-items: stretch center;

            /*Primeiro align-content e depois o justify-content*/
            place-content: stretch normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
