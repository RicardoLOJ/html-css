<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: lightcoral;
        }

        main {
            background-color: lightgreen;
            height: 90vh;
            width: 90vw;

            display: flex;
            flex-flow: row nowrap;

            justify-content: center;
            align-items: center;
        }

        section {
            background-color: lightskyblue;
            height: 200px;
            width: 400px;
            padding: 20px;
            text-align: justify;
        }

        h1 {
            padding: 20px;
            text-align: center;
        }

        p {
            text-indent: 20px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Centralizando com Flexbox</h1>
                <p>Desta maneira, o conteúdo "filho"(section) que está dentro do "pai"(main) ficará centralizado ao "pai" e não ao body. <br> Devemos utilizar 100% do main&gt;height para centralizar à tela, ou aplicar o "pai" no body.</p><br>
                <p><STRONG>OBS:</STRONG> Não utilize o body como pai.</p>
        </section>
    </main>
</body>
</html>
