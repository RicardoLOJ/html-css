<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px; 
            /* Por padrão, a altura e largura de um iframe é 300px de largura e 150px de altura. */
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 

        <!-- Pode ser que a tag scrolling não funcione adequadamente em qualquer navegador, inclusive no google chrome do Windows, mas funciona no chrome da IOS (lembre-se de testar!) -->

        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
            <!-- Caso o navegador não tenha suporte para visualização do iframe, será direcionado ao link. -->
            </iframe>
            
            para aprender a programar.
    </p>

    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0"> no
            <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
        </iframe>

        também é bem legal
    </p>
</body>
</html>
